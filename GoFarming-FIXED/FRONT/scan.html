<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escanear Planta — GoFarming</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="/gofarming/PUBLIC/manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="GoFarming">
    <link rel="apple-touch-icon" href="/gofarming/FRONT/css/Logo.png">
    
    <style>
        :root {
            --purple-main: #7c3aed;
            --purple-light: #a855f7;
            --purple-glow: rgba(124, 58, 237, 0.35);
            --bg-gradient: linear-gradient(180deg, #f6f3fb 0%, #eae5f5 100%);
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-dark);
            padding: 16px 20px 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
        }

        /* Header Topo */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 12px 0 20px;
        }

        .header-back {
            color: var(--purple-main);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* Area da Câmera */
        #camera-area {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #08080a;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Escondido até capturar */
        }

        /* Moldura Tracejada Roxa */
        #laser {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65%;
            height: 65%;
            border: 2px dashed var(--purple-light);
            border-radius: 28px;
            box-shadow: inset 0 0 30px var(--purple-glow), 0 0 25px var(--purple-glow);
            pointer-events: none;
            z-index: 5;
        }

        /* Botão Galeria interno */
        #btn-galeria {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
            border: none;
        }

        #btn-galeria:active {
            transform: scale(0.92);
        }

        /* Botão de Captura */
        .capture-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 24px;
        }

        #btn-captura {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: transparent;
            border: 3px solid var(--purple-main);
            box-shadow: 0 0 20px var(--purple-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            padding: 0;
            transition: transform 0.15s ease;
        }

        #btn-captura::after {
            content: '';
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: var(--purple-main);
            box-shadow: 0 4px 14px var(--purple-glow);
        }

        #btn-captura:active {
            transform: scale(0.95);
        }

        .instruction-text {
            margin-top: 14px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
            text-align: center;
        }

        /* Barra de Navegação Inferior */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 380px;
            background: #ffffff;
            border-radius: 40px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 100;
            padding: 0 12px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            text-decoration: none;
            color: #4b5563;
            font-size: 11px;
            font-weight: 600;
        }

        .nav-btn-center {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--purple-main);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 6px 16px var(--purple-glow);
            margin-top: -16px;
        }

        /* Estados de Análise e Resultado */
        .spinner {
            width: 36px;
            height: 36px;
            border: 3.5px solid rgba(124, 58, 237, 0.2);
            border-top-color: var(--purple-main);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #resultado {
            display: none;
            margin-top: 20px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .dias-grid {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .dia-btn {
            flex: 1;
            min-width: 38px;
            background: #f3f4f6;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #4b5563;
            padding: 10px 0;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .dia-btn.ativo {
            background: var(--purple-main);
            border-color: var(--purple-main);
            color: #ffffff;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--purple-main);
            color: #fff;
            box-shadow: 0 4px 12px var(--purple-glow);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="dashboard.html" class="header-back">← Voltar</a>
            <span class="header-title">Escanear Planta</span>
            <div style="width: 50px;"></div>
        </div>

        <!-- Câmera & Viewport -->
        <div id="camera-area">
            <video id="video" autoplay playsinline></video>
            <img id="preview" alt="Preview da captura">
            
            <!-- Moldura Central Tracejada -->
            <div id="laser"></div>

            <!-- Botão de Galeria -->
            <label for="input-arquivo" id="btn-galeria" title="Carregar da galeria">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
            </label>
            <input type="file" id="input-arquivo" accept="image/*" style="display:none;" onchange="selecionarArquivo(event)">
        </div>

        <!-- Botão de Captura -->
        <div class="capture-wrapper">
            <button id="btn-captura" onclick="capturar()"></button>
            <p class="instruction-text">Posicione a folha no centro do quadro</p>
        </div>

        <!-- Tela de Processamento -->
        <div id="analisando" style="display:none; text-align:center; padding:30px 20px;">
            <div class="spinner" style="margin:0 auto 16px;"></div>
            <p style="color:var(--purple-main); font-weight:600;">Identificando planta...</p>
        </div>

        <!-- Resultado da IA -->
        <div id="resultado">
            <div class="card">
                <div style="display:flex; gap:14px; align-items:center; margin-bottom:16px;">
                    <img id="foto-resultado" style="width:70px; height:70px; border-radius:16px; object-fit:cover; border:1px solid #e5e7eb;">
                    <div>
                        <div id="nome-planta" style="font-size:18px; font-weight:700;"></div>
                        <div id="especie-planta" style="color:#6b7280; font-size:13px;"></div>
                        <div id="confianca-planta" style="color:#7c3aed; font-size:12px; font-weight:600; margin-top:4px;"></div>
                    </div>
                </div>

                <div style="background:#f9fafb; border-radius:14px; padding:12px; margin-bottom:14px; border:1px solid #e5e7eb;">
                    <div style="font-size:11px; font-weight:700; color:#6b7280; margin-bottom:4px;">FREQUÊNCIA SUGERIDA PELA IA</div>
                    <div id="frequencia-planta" style="font-size:14px; font-weight:600;"></div>
                </div>

                <div style="background:#f9fafb; border-radius:14px; padding:12px; margin-bottom:16px; border:1px solid #e5e7eb;">
                    <div style="font-size:11px; font-weight:700; color:#6b7280; margin-bottom:8px;">DIAS DE REGA — edite se quiser</div>
                    <div class="dias-grid" id="dias-scan">
                        <button type="button" class="dia-btn" data-dia="1" onclick="alternarDiaScan(1)">Seg</button>
                        <button type="button" class="dia-btn" data-dia="2" onclick="alternarDiaScan(2)">Ter</button>
                        <button type="button" class="dia-btn" data-dia="3" onclick="alternarDiaScan(3)">Qua</button>
                        <button type="button" class="dia-btn" data-dia="4" onclick="alternarDiaScan(4)">Qui</button>
                        <button type="button" class="dia-btn" data-dia="5" onclick="alternarDiaScan(5)">Sex</button>
                        <button type="button" class="dia-btn" data-dia="6" onclick="alternarDiaScan(6)">Sáb</button>
                        <button type="button" class="dia-btn" data-dia="7" onclick="alternarDiaScan(7)">Dom</button>
                    </div>

                    <div style="margin-top:12px; display:flex; align-items:center; gap:10px;">
                        <label style="font-size:13px; color:#6b7280;">Horário de rega:</label>
                        <input type="time" id="horario-scan" value="08:00" style="flex:1; padding:8px; border-radius:10px; border:1px solid #e5e7eb;">
                    </div>
                </div>

                <div style="display:flex; flex-direction:column; gap:10px;">
                    <button class="btn btn-primary" onclick="salvarNoJardim()">Adicionar ao jardim</button>
                    <button class="btn btn-outline" onclick="reiniciar()">Tentar novamente</button>
                </div>
            </div>
        </div>

        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <!-- Navegação Inferior Flutuante -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Jardim</span>
        </a>

        <div class="nav-btn-center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
            </svg>
        </div>

        <a href="login.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Sair</span>
        </a>
    </nav>

    <script src="js/api.js"></script>
    <script src="js/scan.js"></script>
</body>
</html>
