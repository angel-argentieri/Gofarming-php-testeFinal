<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planta — GoFarming</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="/gofarming/PUBLIC/manifest.json">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GoFarming">
    <link rel="apple-touch-icon" href="css/Logo.png">
    <style>
        .foto-planta {
            width:100%; height:220px; object-fit:cover;
            border-radius:24px; border:1px solid var(--border-card); background:var(--bg-card);
            box-shadow: var(--shadow-soft);
        }
        .pergunta-btn {
            background:var(--bg-pill); border:1px solid rgba(139, 92, 246, 0.2);
            border-radius:20px; color:var(--purple-dark);
            padding:10px 16px; font-size:13px; font-weight:600; cursor:pointer;
            text-align:left; transition:all .2s ease;
        }
        .pergunta-btn:hover { border-color:var(--purple-primary); background:var(--purple-light); }
        .msg-ia {
            background:#f1ecf9; border-left:4px solid var(--purple-primary);
            border-radius:0 16px 16px 16px; padding:12px 16px;
            font-size:14px; line-height:1.6; align-self:stretch; white-space:pre-wrap;
            color:var(--text-title);
        }
        .msg-usuario {
            background:linear-gradient(135deg, var(--purple-primary), var(--purple-hover)); color:#ffffff;
            border-radius:16px 16px 4px 16px; padding:10px 14px;
            font-size:14px; line-height:1.5; align-self:flex-end; max-width:85%;
            box-shadow: 0 4px 12px var(--purple-glow);
        }
        .msg-erro { border-left-color:#ef4444; background:#fef2f2; color:#991b1b; }
        #chat-mensagens {
            display:none; flex-direction:column; gap:10px;
            max-height:340px; overflow-y:auto; padding:4px 2px;
        }
        .chat-form { display:flex; gap:8px; margin-top:8px; }
        .chat-form input {
            flex:1; background:var(--bg-input); border:1.5px solid var(--border-card);
            border-radius:20px; color:var(--text-title); padding:12px 18px;
            font-size:14px; outline:none;
        }
        .chat-form input:focus { border-color:var(--purple-primary); box-shadow: 0 0 0 3px var(--purple-subtle-glow); }
        .chat-form button {
            background:linear-gradient(135deg, var(--purple-primary), var(--purple-hover)); color:#ffffff; border:none;
            border-radius:20px; padding:0 22px; font-weight:700; cursor:pointer;
            box-shadow: var(--shadow-purple-btn);
            transition: all 0.2s ease;
        }
        .chat-form button:hover { transform: translateY(-1px); }
        .dias-grid { display:flex; gap:6px; flex-wrap:wrap; }
        
        /* Botões dos dias da semana com alta especificidade */
        .dias-grid button.dia-btn {
            flex:1; min-width:40px; background:var(--bg-input) !important;
            border:1.5px solid var(--border-card) !important; border-radius:12px !important;
            color:var(--text-muted) !important; padding:10px 0 !important; font-size:12px !important;
            font-weight:600 !important; cursor:pointer; transition:all .15s ease;
        }
        .dias-grid button.dia-btn.ativo { 
            background:var(--purple-primary) !important; 
            border-color:var(--purple-primary) !important; 
            color:#ffffff !important; 
            box-shadow: 0 4px 12px var(--purple-glow) !important;
        }

        .linha-rega {
            display:flex; justify-content:space-between;
            font-size:13px; padding:8px 0; border-bottom:1px dashed var(--border-card);
        }
        .linha-rega:last-child { border-bottom:none; }
        .linha-rega .ok   { color:var(--green-text); font-weight:700; }
        .linha-rega .pend { color:var(--purple-primary); font-weight:700; }
        .horario-wrap { display:flex; align-items:center; gap:10px; }
        .horario-wrap label { font-size:12px; color:var(--text-muted); font-weight:700; text-transform:uppercase; white-space:nowrap; }
        .horario-wrap input[type="time"] {
            flex:1; background:var(--bg-input); border:1.5px solid var(--border-card);
            border-radius:12px; color:var(--text-title); padding:8px 12px;
            font-size:14px; outline:none;
        }
        .btn-danger {
            background: #fee2e2 !important;
            color: #ef4444 !important;
            border: 1px solid rgba(239, 68, 68, 0.2) !important;
            box-shadow: none !important;
        }
        .btn-danger:hover {
            background: #fca5a5 !important;
            color: #991b1b !important;
        }
    </style>
</head>
<body>
    <div class="header" style="position:relative;">
        <a href="dashboard.html" style="color:var(--purple-primary);text-decoration:none;font-size:14px;font-weight:700;">← Voltar</a>
        <div class="sino-wrap">
            <button id="sino" class="btn-sino" onclick="alternarPainel()" aria-label="Notificações">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span id="sino-badge"></span>
            </button>
            <div id="painel-notificacoes" class="painel-notificacoes">
                <div class="painel-cabecalho">
                    <span>Notificações</span>
                    <button onclick="marcarTodasLidas()">Marcar todas como lidas</button>
                </div>
                <div id="painel-corpo"></div>
            </div>
        </div>
    </div>

    <div class="page gap">
        <img id="foto" class="foto-planta" src="" alt="Foto da planta">

        <div>
            <h2 id="nome" style="font-size:24px;font-weight:800;color:var(--text-title);"></h2>
            <div id="especie" class="muted"></div>
        </div>

        <div class="card">
            <div class="muted" style="font-size:11px;font-weight:700;margin-bottom:6px;text-transform:uppercase;">FREQUÊNCIA DE REGA</div>
            <div id="frequencia" style="font-size:15px;color:var(--text-title);font-weight:600;"></div>
        </div>

        <div class="card gap">
            <div class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase;">AGENDA SEMANAL — escolha os dias</div>

            <div class="dias-grid">
                <button type="button" class="dia-btn" data-dia="1" onclick="alternarDia(1)">Seg</button>
                <button type="button" class="dia-btn" data-dia="2" onclick="alternarDia(2)">Ter</button>
                <button type="button" class="dia-btn" data-dia="3" onclick="alternarDia(3)">Qua</button>
                <button type="button" class="dia-btn" data-dia="4" onclick="alternarDia(4)">Qui</button>
                <button type="button" class="dia-btn" data-dia="5" onclick="alternarDia(5)">Sex</button>
                <button type="button" class="dia-btn" data-dia="6" onclick="alternarDia(6)">Sáb</button>
                <button type="button" class="dia-btn" data-dia="7" onclick="alternarDia(7)">Dom</button>
            </div>

            <div class="horario-wrap">
                <label>Horário de rega:</label>
                <input type="time" id="horario-rega" value="08:00">
            </div>

            <button class="btn btn-primary" onclick="salvarAgenda()">Salvar agenda</button>

            <div class="muted" style="font-size:11px;font-weight:700;margin-top:4px;text-transform:uppercase;">PRÓXIMAS REGAS</div>
            <div id="proximas-regas"></div>
        </div>

        <div id="rega-hoje" style="display:none;">
            <button class="btn btn-primary" id="btn-regar" onclick="regar()">
                💧 Já reguei hoje
            </button>
        </div>

        <div class="card gap">
            <div style="font-size:15px;font-weight:700;color:var(--purple-primary);">Perguntar sobre esta planta</div>
            <div class="dias-grid" style="gap:6px;">
                <button class="pergunta-btn" onclick="perguntarIA('Como devo regar essa planta?')">Como regar?</button>
                <button class="pergunta-btn" onclick="perguntarIA('Qual a melhor iluminação para ela?')">Iluminação</button>
                <button class="pergunta-btn" onclick="perguntarIA('Como saber se ela está doente?')">Está doente?</button>
                <button class="pergunta-btn" onclick="perguntarIA('Como e quando adubar?')">Adubação</button>
            </div>
            <div id="chat-mensagens"></div>
            <form class="chat-form" onsubmit="enviarPergunta(event)">
                <input id="chat-input" type="text" placeholder="Pergunte qualquer coisa..." autocomplete="off">
                <button type="submit">Enviar</button>
            </form>
        </div>

        <button class="btn btn-danger" onclick="removerPlanta()">Remover planta</button>
    </div>

    <script src="js/api.js"></script>
    <script src="js/planta.js"></script>
    <script src="js/notificacoes.js"></script>
</body>
</html>
