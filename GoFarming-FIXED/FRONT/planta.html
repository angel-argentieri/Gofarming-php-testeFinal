<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planta — GoFarming</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="/gofarming/PUBLIC/manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GoFarming">
    <link rel="apple-touch-icon" href="/gofarming/FRONT/css/Logo.png">
    <style>
        .foto-planta {
            width:100%; height:220px; object-fit:cover;
            border-radius:20px; border:1.5px solid var(--border); background:#111;
        }
        .pergunta-btn {
            background:#111; border:1px solid var(--border);
            border-radius:20px; color:var(--text);
            padding:10px 16px; font-size:13px; cursor:pointer;
            text-align:left; transition:border-color .2s;
        }
        .pergunta-btn:hover { border-color:var(--neon); color:var(--neon); }
        .msg-ia {
            background:#111; border-left:3px solid var(--neon);
            border-radius:0 12px 12px 0; padding:12px 16px;
            font-size:14px; line-height:1.6; align-self:stretch; white-space:pre-wrap;
        }
        .msg-usuario {
            background:var(--neon,#B8A8FF); color:#000;
            border-radius:14px 14px 4px 14px; padding:10px 14px;
            font-size:14px; line-height:1.5; align-self:flex-end; max-width:85%;
        }
        .msg-erro { border-left-color:#ff6b6b; color:#ff9d9d; }
        #chat-mensagens {
            display:none; flex-direction:column; gap:8px;
            max-height:340px; overflow-y:auto; padding:4px 2px;
        }
        .chat-form { display:flex; gap:8px; }
        .chat-form input {
            flex:1; background:#111; border:1px solid var(--border);
            border-radius:20px; color:var(--text); padding:11px 16px;
            font-size:14px; outline:none;
        }
        .chat-form input:focus { border-color:var(--neon); }
        .chat-form button {
            background:var(--neon,#B8A8FF); color:#000; border:none;
            border-radius:20px; padding:0 18px; font-weight:700; cursor:pointer;
        }
        .dias-grid { display:flex; gap:6px; flex-wrap:wrap; }
        .dia-btn {
            flex:1; min-width:40px; background:#111;
            border:1px solid var(--border); border-radius:12px;
            color:#8b8b9e; padding:10px 0; font-size:12px;
            font-weight:600; cursor:pointer; transition:all .15s;
        }
        .dia-btn.ativo { background:var(--neon,#B8A8FF); border-color:var(--neon,#B8A8FF); color:#000; }
        .linha-rega {
            display:flex; justify-content:space-between;
            font-size:13px; padding:7px 0; border-bottom:1px solid var(--border);
        }
        .linha-rega:last-child { border-bottom:none; }
        .linha-rega .ok   { color:#6ee7a8; }
        .linha-rega .pend { color:var(--neon,#B8A8FF); }
        .horario-wrap { display:flex; align-items:center; gap:10px; }
        .horario-wrap label { font-size:12px; color:#8b8b9e; white-space:nowrap; }
        .horario-wrap input[type="time"] {
            flex:1; background:#111; border:1px solid var(--border);
            border-radius:10px; color:#fff; padding:8px 12px;
            font-size:14px; outline:none; color-scheme:dark;
        }
        .horario-wrap input[type="time"]:focus { border-color:var(--neon); }
    </style>
</head>
<body>
    <div class="header" style="position:relative;">
        <a href="dashboard.html" style="color:var(--neon);text-decoration:none;font-size:14px;">← Voltar</a>
        <div class="sino-wrap">
            <button id="sino" class="btn-sino" onclick="alternarPainel()" aria-label="Notificações">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 01-3.46 0"/>
                </svg>
                <span id="sino-badge"></span>
            </button>
            <div id="painel-notificacoes" class="painel-notificacoes">
                <div class="painel-cabecalho">
                    <span>Notificações</span>
                    <button onclick="marcarTodasLidas()">Marcar todas como lidas</button>
                </div>
                <div id="painel-corpo"></div>
            </div>
        </div>
    </div>

    <div class="page gap">
        <img id="foto" class="foto-planta" src="" alt="Foto da planta">

        <div>
            <h2 id="nome" style="font-size:24px;font-weight:700;"></h2>
            <div id="especie" class="muted"></div>
        </div>

        <div class="card">
            <div class="muted" style="font-size:11px;margin-bottom:6px;">FREQUÊNCIA DE REGA</div>
            <div id="frequencia" style="font-size:15px;"></div>
        </div>

        <div class="card gap">
            <div class="muted" style="font-size:11px;">AGENDA SEMANAL — escolha os dias</div>

            <div class="dias-grid">
                <button type="button" class="dia-btn" data-dia="1" onclick="alternarDia(1)">Seg</button>
                <button type="button" class="dia-btn" data-dia="2" onclick="alternarDia(2)">Ter</button>
                <button type="button" class="dia-btn" data-dia="3" onclick="alternarDia(3)">Qua</button>
                <button type="button" class="dia-btn" data-dia="4" onclick="alternarDia(4)">Qui</button>
                <button type="button" class="dia-btn" data-dia="5" onclick="alternarDia(5)">Sex</button>
                <button type="button" class="dia-btn" data-dia="6" onclick="alternarDia(6)">Sáb</button>
                <button type="button" class="dia-btn" data-dia="7" onclick="alternarDia(7)">Dom</button>
            </div>

            <div class="horario-wrap">
                <label>Horário de rega:</label>
                <input type="time" id="horario-rega" value="08:00">
            </div>

            <button class="btn btn-primary" onclick="salvarAgenda()">Salvar agenda</button>

            <div class="muted" style="font-size:11px;margin-top:4px;">PRÓXIMAS REGAS</div>
            <div id="proximas-regas"></div>
        </div>

        <div id="rega-hoje" style="display:none;">
            <button class="btn btn-primary" id="btn-regar" onclick="regar()">
                💧 Já reguei hoje
            </button>
        </div>

        <div class="card gap">
            <div style="font-size:15px;font-weight:600;color:var(--neon);">Perguntar sobre esta planta</div>
            <div class="dias-grid" style="gap:6px;">
                <button class="pergunta-btn" onclick="perguntarIA('Como devo regar essa planta?')">Como regar?</button>
                <button class="pergunta-btn" onclick="perguntarIA('Qual a melhor iluminação para ela?')">Iluminação</button>
                <button class="pergunta-btn" onclick="perguntarIA('Como saber se ela está doente?')">Está doente?</button>
                <button class="pergunta-btn" onclick="perguntarIA('Como e quando adubar?')">Adubação</button>
            </div>
            <div id="chat-mensagens"></div>
            <form class="chat-form" onsubmit="enviarPergunta(event)">
                <input id="chat-input" type="text" placeholder="Pergunte qualquer coisa..." autocomplete="off">
                <button type="submit">Enviar</button>
            </form>
        </div>

        <button class="btn btn-danger" onclick="removerPlanta()">Remover planta</button>
    </div>

    <script src="js/api.js"></script>
    <script src="js/planta.js"></script>
    <script src="js/notificacoes.js"></script>
</body>
</html>
